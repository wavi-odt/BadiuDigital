<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Badiu Digital | estúdio digital." />
    <meta name="theme-color" content="#061F25" id="meta-theme-color" />
    <script>
      (function(){
        var t=localStorage.getItem('badiu-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
        document.documentElement.dataset.theme=t;
        if(t==='light') document.getElementById('meta-theme-color').content='#F5EDD8';
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <title>Badiu Digital — Software com raízes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
